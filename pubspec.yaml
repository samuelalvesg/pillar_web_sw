name: pillar_web_sw
description: "Generates a release-scoped service worker and its registration script for the Flutter web builds of the pillar ecosystem apps."
version: 0.0.1
homepage: https://github.com/samuelalvesg/pillar_web_sw

environment:
  sdk: ^3.11.0

executables:
  pillar_web_sw: generate

dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  glob: ^2.1.3
  path: ^1.9.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
